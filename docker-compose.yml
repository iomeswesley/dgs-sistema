services:
  postgres:
    image: postgres:17
    container_name: dgs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dgs_local_dev
      POSTGRES_DB: sistema_dgs
    ports:
      - "5432:5432"
    volumes:
      - dgs_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dgs_pg_data:
